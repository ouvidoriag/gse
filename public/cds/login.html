<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando para o Login Unificado...</title>
  <script>
    const isGse = window.location.pathname.toLowerCase().startsWith('/gse');
    const base = isGse ? '/gse' : '';
    window.location.replace(base + '/login' + window.location.search);
  </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background: #0b1325; color: #ffffff;">
  <p>Redirecionando para o Portal de Login Unificado...</p>
</body>
</html>
