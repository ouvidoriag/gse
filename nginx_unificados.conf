# ==============================================================================
# 🏛️ PREFEITURA MUNICIPAL DE DUQUE DE CAXIAS — RJ
# NGINX REVERSE PROXY — CONFIGURAÇÃO PARA A MÁQUINA VIRTUAL DE PRODUÇÃO
# Arquivo no servidor: /etc/nginx/sites-available/default
# Servidor: ogmanalytics.duquedecaxias.rj.gov.br (ou ogm.duquedecaxias.rj.gov.br)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DEFINIÇÃO DO UPSTREAM (PORTA DO NODE.JS)
# ------------------------------------------------------------------------------
# Se rodar como Portal Unificado completo (Hub + CDS + SIGEM): porta 3032
# Se rodar como substituto direto do SIGEM antigo no PM2: porta 3015
upstream pmdc_unificados_upstream {
    server 127.0.0.1:3032;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 2. BLOCOS DE LOCATION PARA ADICIONAR AO BLOCO server { ... } DA VM
# ------------------------------------------------------------------------------

    # ----------------------------------------------------------
    # MÓDULO SIGEM — GESTÃO DE ENDEREÇOS E EQUIPAMENTOS MUNICIPAIS
    # ----------------------------------------------------------
    location /sigem/ {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        client_max_body_size 25M;
    }

    # API Dedicada do SIGEM
    location /sigem/api/ {
        proxy_pass http://pmdc_unificados_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Redirecionamento amigável de links legados de /enderecos para /sigem/
    location = /enderecos {
        return 301 /sigem/;
    }
    location /enderecos/ {
        proxy_pass http://pmdc_unificados_upstream/sigem/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # MÓDULO CARTA DE SERVIÇOS AO CIDADÃO (CDS)
    # ----------------------------------------------------------
    location /cds/ {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        client_max_body_size 25M;
    }

    location /cds/api/ {
        proxy_pass http://pmdc_unificados_upstream/cds/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # RECURSOS COMPARTILHADOS (Barra Institucional PMDC, Login e Favicon)
    # ----------------------------------------------------------
    location /shared/ {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /login {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # HUB CENTRAL (Se desejado expor em /hub/ ou como raiz alternativa)
    # ----------------------------------------------------------
    location /hub/ {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------------------
    # API EXTERNA PARA SISTEMAS TERCEIROS (COM CHAVE DE API)
    # ----------------------------------------------------------
    location /api/v1/ {
        # Métodos liberados: Leitura, Geração e Exclusão de Chaves no Portal
        limit_except GET POST DELETE OPTIONS {
            deny all;
        }

        # Suporte completo a CORS para aplicações web externas
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'X-API-Key, Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Expose-Headers' 'X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset-Day' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://pmdc_unificados_upstream/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Portal do Desenvolvedor & Gestão da API (Documentação Interativa e Chaves)
    location = /api {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/docs {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /docs {
        proxy_pass http://pmdc_unificados_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

# ==============================================================================
# FIM DA CONFIGURAÇÃO
# ==============================================================================
